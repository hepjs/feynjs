[project]
site_url = "https://hepjs.github.io/feynjs/"
site_name = "feynjs"
site_description = "Feynman diagrams for the web, written as text and laid out automatically"
# site_description = "Your project description"
# site_author = "Your name"

copyright = "Copyright &copy; 2026 Jason Oliver &middot; MIT licence"

repo_url = "https://github.com/hepjs/feynjs"
repo_name = "hepjs/feynjs"
edit_uri = "edit/main/docs/"

nav = [
  { "Features" = "features.md" },
  { "Get started" = [
    { "Get started" = "get-started/index.md" },
    { "Setup" = "get-started/setup.md" },
    { "Your first diagram" = "get-started/first-diagram.md" },
    { "About" = "get-started/about.md" },
  ] },
  { "Guide" = [
    { "Overview" = "guide/index.md" },
    { "Writing diagrams" = "guide/syntax.md" },
    { "Processes" = "guide/processes.md" },
    { "Lines, particles and labels" = "guide/lines.md" },
    { "Vertices, loops and hadrons" = "guide/vertices.md" },
    { "Colour flow" = "guide/colour-flow.md" },
    { "Detector objects" = "guide/objects.md" },
    { "Layout" = "guide/layout.md" },
    { "Views" = "guide/views.md" },
    { "Styling, export and checks" = "guide/styling.md" },
    { "Coming from TikZ-Feynman" = "guide/tikz-feynman.md" },
    { "Coming from MadGraph" = "guide/madgraph.md" },
    { "Reference" = [
      { "Syntax at a glance" = "reference/index.md" },
      { "All particles and line types" = "reference/particles.md" },
      { "Theme settings" = "reference/theme.md" },
      { "JavaScript API" = "reference/api.md" },
      { "Command line" = "reference/cli.md" },
      { "Hand-over format" = "reference/interchange.md" },
      { "Contributing" = "reference/contributing.md" },
      { "Internals" = "reference/internals.md" },
    ] },
  ] },
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "Names and syntax" = "examples/names-and-syntax.md" },
    { "Standard Model vertices" = "examples/sm-vertices.md" },
    { "Standard Model processes" = "examples/sm-processes.md" },
    { "Stop production" = "examples/stop.md" },
    { "Gallery" = "examples/gallery.md" },
    { "MadGraph gallery" = "examples/madgraph-gallery.md" },
  ] },
  { "Playground" = "playground.md" },
]

extra_css = ["stylesheets/feynjs.css", "stylesheets/theme.css"]
# the released library from npm, through jsDelivr: the site shows what users of 0.9 get
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/feynjs@0.9/dist/feynjs.min.js",
  "javascripts/feynjs-init.js",
  "javascripts/playground.js",
]

[project.theme]
# fonts are local (docs/fonts, docs/stylesheets/theme.css), so the site works offline
font = false
# variant = "classic"
# custom_dir = "overrides"
favicon = "brand/logo/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  "navigation.expand",
  # "navigation.footer",
  # "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "brand/logo/mark-red.svg"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  { name = "feynman", class = "feynman", format = "pymdownx.superfences.fence_div_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
# tabs get ids from their titles, so a link can open one: get-started/setup/#setup-latex
pymdownx.tabbed.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
