[project]
site_url = "https://joliverhep.github.io/feynjs/"
site_name = "feynjs"
site_description = "Feynman diagrams for the web, written as text and laid out automatically"
# site_description = "Your project description"
# site_author = "Your name"

copyright = "Copyright &copy; 2026 Jason Oliver &middot; MIT licence"

repo_url = "https://github.com/joliverHEP/feynjs"
repo_name = "joliverHEP/feynjs"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Get started" = "get-started/index.md" },
    { "Where to use it" = "get-started/use.md" },
  ] },
  { "Guide" = [
    { "Overview" = "guide/index.md" },
    { "Writing diagrams" = [
      { "Edges, as in TikZ-Feynman" = "guide/syntax.md" },
      { "Processes, as in MadGraph" = "guide/processes.md" },
    ] },
    { "Drawing" = [
      { "Lines and particles" = "guide/lines.md" },
      { "Labels" = "guide/labels.md" },
      { "Vertices and blobs" = "guide/vertices.md" },
      { "Loops, boxes and hadrons" = "guide/loops-hadrons.md" },
      { "Colour flow" = "guide/colour-flow.md" },
      { "Detector objects" = "guide/objects.md" },
      { "Panels and switches" = "guide/panels.md" },
    ] },
    { "Beyond drawing" = [
      { "Layout" = "guide/layout.md" },
      { "Styling and export" = "guide/styling.md" },
      { "Checking diagrams" = "guide/tools.md" },
    ] },
  ] },
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "Gallery" = "examples/gallery.md" },
    { "Stop production" = "examples/stop.md" },
  ] },
  { "Reference" = [
    { "Syntax at a glance" = "reference/index.md" },
    { "JavaScript API" = "reference/api.md" },
    { "Command line" = "reference/cli.md" },
    { "Particles" = "reference/particles.md" },
    { "Theme settings" = "reference/theme.md" },
    { "Layout rules (v1)" = "reference/layout-rules.md" },
  ] },
  { "Contributing" = [
    { "How to contribute" = "contributing/index.md" },
    { "Development setup" = "contributing/setup.md" },
    { "Architecture" = "contributing/architecture.md" },
    { "Extending feynjs" = "contributing/extending.md" },
    { "Testing" = "contributing/testing.md" },
    { "Feature demonstrations" = "contributing/demos.md" },
    { "The docs site" = "contributing/docs.md" },
  ] },
]

extra_css = ["stylesheets/feynjs.css", "stylesheets/theme.css"]
extra_javascript = [
  "javascripts/feynjs.min.js",
  "javascripts/feynjs-init.js",
]

[project.theme]
# fonts are local (docs/fonts, docs/stylesheets/theme.css), so the site works offline
font = false
# variant = "classic"
# custom_dir = "overrides"
favicon = "brand/logo/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "brand/logo/mark-red.svg"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  { name = "feynman", class = "feynman", format = "pymdownx.superfences.fence_div_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
