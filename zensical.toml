[project]
site_url = "https://hepjs.github.io/feynjs/"
site_name = "feynjs"
site_description = "Feynman diagrams for the web, written as text and laid out automatically"
# site_description = "Your project description"
# site_author = "Your name"

copyright = "Copyright &copy; 2026 Jason Oliver &middot; MIT licence"

repo_url = "https://github.com/hepjs/feynjs"
repo_name = "hepjs/feynjs"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Get started" = "get-started/index.md" },
    { "Your first diagram" = "get-started/first-diagram.md" },
    { "About" = "get-started/about.md" },
    { "Guides" = [
      { "Contributing" = "get-started/guides/contributing.md" },
      { "Internals" = "get-started/guides/internals.md" },
    ] },
  ] },
  { "Usage" = [
    { "Install" = "usage/index.md" },
    { "Command line" = "usage/cli.md" },
    { "JavaScript API" = "usage/api.md" },
    { "Checking diagrams" = "usage/checks.md" },
    { "Exporting" = "usage/export.md" },
    { "Hand-over format" = "usage/interchange.md" },
  ] },
  { "Setup" = [
    { "Styling" = "setup/index.md" },
    { "Theme settings" = "setup/theme.md" },
  ] },
  { "Authoring" = [
    { "How it works" = "authoring/index.md" },
    { "Writing diagrams" = "authoring/syntax.md" },
    { "Lines, particles and labels" = "authoring/lines.md" },
    { "All particles and line types" = "authoring/particles.md" },
    { "Processes" = "authoring/processes.md" },
    { "Vertices, loops and hadrons" = "authoring/vertices.md" },
    { "Colour flow" = "authoring/colour-flow.md" },
    { "Detector objects" = "authoring/objects.md" },
    { "Engines" = "authoring/engines.md" },
    { "Drawing the eye" = "authoring/emphasis.md" },
    { "Views" = "authoring/views.md" },
    { "Syntax at a glance" = "authoring/syntax-at-a-glance.md" },
    { "Examples" = [
      { "Overview" = "authoring/examples/index.md" },
      { "Tour" = "authoring/examples/tour.md" },
      { "The Standard Model" = "authoring/examples/standard-model.md" },
      { "Diboson" = "authoring/examples/diboson.md" },
      { "V + jets" = "authoring/examples/vjets.md" },
      { "Top quarks" = "authoring/examples/top.md" },
      { "Higgs" = "authoring/examples/higgs.md" },
      { "Flavour physics" = "authoring/examples/flavour.md" },
      { "Nuclear and heavy ions" = "authoring/examples/nuclear.md" },
      { "Beyond the Standard Model" = "authoring/examples/bsm.md" },
      { "Supersymmetry" = "authoring/examples/susy.md" },
      { "Stop production, step by step" = "authoring/examples/stop.md" },
      { "Extra dimensions" = "authoring/examples/kaluza-klein.md" },
    ] },
  ] },
  { "Compatibility" = [
    { "Zensical and MkDocs" = "compatibility/zensical.md" },
    { "Web pages" = "compatibility/web.md" },
    { "Obsidian" = "compatibility/obsidian.md" },
    { "LaTeX" = "compatibility/latex.md" },
    { "TikZ-Feynman" = "compatibility/tikz-feynman.md" },
    { "MadGraph" = "compatibility/madgraph.md" },
    { "MadGraph gallery" = "compatibility/madgraph-gallery.md" },
    { "Browsers and Node" = "compatibility/browsers.md" },
  ] },
  { "Playground" = "playground.md" },
]

extra_css = ["stylesheets/feynjs.css", "stylesheets/theme.css"]
# the released library from npm, through jsDelivr: the site shows what users of 0.9 get
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/feynjs@0.10/dist/feynjs.min.js",
  "javascripts/feynjs-init.js",
  "javascripts/playground.js",
]

[project.theme]
# fonts are local (docs/fonts, docs/stylesheets/theme.css), so the site works offline
font = false
# variant = "classic"
# custom_dir = "overrides"
favicon = "brand/logo/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  "navigation.expand",
  # "navigation.footer",
  # "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "brand/logo/mark-red.svg"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

# each docs folder's .meta.yml gives its pages their shared front matter (the section's tag)
[project.plugins.meta]

[project.plugins.tags]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  { name = "feynman", class = "feynman", format = "pymdownx.superfences.fence_div_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
# tabs get ids from their titles, so a link can open one: get-started/setup/#setup-latex
pymdownx.tabbed.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
