[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feynjs"
dynamic = ["version"]
description = "Feynman diagrams from text, for Sphinx and Jupyter: the feynjs engine, bundled"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Oliver" }, { name = "Pengxuan Zhu" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["Feynman diagrams", "particle physics", "Sphinx", "Jupyter", "visualisation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Sphinx :: Extension",
  "Framework :: Jupyter",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://hepjs.github.io/feynjs/"
Source = "https://github.com/hepjs/feynjs"
Changelog = "https://github.com/hepjs/feynjs/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/feynjs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/feynjs"]
# (the script is copied in at build time, not kept in git: scripts/python-package.mjs)
artifacts = ["src/feynjs/static/feynjs.min.js"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/feynjs/static/feynjs.min.js"]
