# A version tag (v0.9.1): test, build, publish to npm (and so to jsDelivr and unpkg), and make a
# GitHub release with the built files. npm trusts this workflow by "trusted publishing" (set up
# once on npmjs.com for the package), so no npm token is stored here. A version already on npm
# (the first, published by hand) is not published again.
# (on Apple Silicon, where the approved layouts were approved: see ci.yml)
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm
      # (trusted publishing needs npm 11.5.1 or later)
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Publish to npm (unless this version is there already)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "feynjs@$VERSION" version >/dev/null 2>&1; then echo "feynjs@$VERSION is on npm already"; else npm publish --provenance --access public; fi
      - name: Build the Obsidian plugin, zipped as a folder to drop into a vault's plugins
        run: |
          node integrations/obsidian/build.mjs
          (cd integrations/obsidian/dist && zip -r ../../../feynjs-obsidian.zip feynjs)
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/feynjs.min.js
            dist/feynjs.mjs
            feynjs-obsidian.zip
