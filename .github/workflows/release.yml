# A version tag (v0.9.0): test, build, publish to npm (and so to jsDelivr and unpkg), and make a
# GitHub release with the built files. Needs the repository secret NPM_TOKEN (an npm automation token).
# (on Apple Silicon, where the approved layouts were approved: see ci.yml)
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/feynjs.min.js
            dist/feynjs.mjs
