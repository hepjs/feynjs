# Every push and pull request: type-check, build and test. The approved layouts are checked on
# Apple Silicon, where they were approved: the layout's arithmetic rounds a little differently on
# other processors, enough to move a few diagrams slightly.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
  layouts:
    # (macOS runners are free on public repositories; while this one is private, npm test checks the
    # layouts on the developer's Mac before pushing)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:layouts
