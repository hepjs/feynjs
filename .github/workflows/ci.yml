# Every push and pull request: type-check, build and test. The layout's maths gives the same bits
# on every processor (src/geometry/portable-math.ts), so the approved layouts hold on Linux as on
# Apple Silicon; the Platforms workflow compares every diagram across systems and engines.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
  layouts:
    # (macOS runners are free on public repositories; while this one is private, npm test checks the
    # layouts on the developer's Mac before pushing)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:layouts
